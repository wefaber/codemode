# Template for /etc/nginx/sites-available/mcp.wefaber.net (docs/PLAN.md, Task 5.1 and 5.4).
# Blue/green: `current` points at the live slot; to switch slots change the symlink and the port below, then reload.
upstream codemode_gateway {
    server 127.0.0.1:4171;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.wefaber.net;

    # Certificate: issued for mcp.wefaber.net (Task 5.4).
    ssl_certificate     /etc/letsencrypt/live/mcp.wefaber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.wefaber.net/privkey.pem;

    # The gateway enforces 64 KB itself; this only stops oversized bodies earlier.
    client_max_body_size 80k;

    location / {
        proxy_pass http://codemode_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
