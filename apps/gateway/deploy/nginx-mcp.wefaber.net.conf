# mcp.wefaber.net -> WeFaber Code Mode gateway (apps/gateway).
#
# Enabled on 2026-11-01 (docs/PLAN.md Task 5.4): wegraph moved to
# wegraph.wefaber.net (D1) and mcp.wefaber.net is a proxied CNAME to this host,
# so this vhost is the gateway's public entry.
#
# <HOST_IPV4> and <HOST_IPV6> are the host's own addresses (the ones the other
# vhosts in sites-enabled list); replace them when installing. They are not kept
# in this public repo.
#
# Blue/green: one codemode-gateway@<slot> unit per slot (blue 4191, green 4192).
# The `server` line of the upstream is the only thing that changes on a switch;
# the deploy workflow rewrites it and reloads nginx. /srv/codemode/current
# points at the live slot.
upstream codemode_gateway {
    server 127.0.0.1:4191;
    keepalive 16;
}

server {
    listen <HOST_IPV4>:80;
    listen [<HOST_IPV6>]:80;
    server_name mcp.wefaber.net;
    return 301 https://$host$request_uri;
}

server {
    # Explicit addresses, like every other vhost on this host: nginx.conf pins a
    # default_server on <HOST_IPV4>:443, and a wildcard `listen 443 ssl` loses to
    # that more specific socket, so the SNI of mcp fell to the default cert (520).
    listen <HOST_IPV4>:443 ssl;
    listen [<HOST_IPV6>]:443 ssl;
    listen 127.0.0.1:443 ssl;
    http2 on;
    server_name mcp.wefaber.net;

    ssl_certificate     /etc/letsencrypt/live/mcp.wefaber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.wefaber.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mcp.wefaber.net.access.log;
    error_log  /var/log/nginx/mcp.wefaber.net.error.log;

    # The gateway enforces 64 KB itself; this only stops oversized bodies earlier.
    client_max_body_size 80k;

    location / {
        proxy_pass http://codemode_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run can last WCM_RUN_TIMEOUT_MS (15 s) plus the write of the response.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # SSE / streamable HTTP must not be buffered.
        proxy_buffering off;
    }
}
